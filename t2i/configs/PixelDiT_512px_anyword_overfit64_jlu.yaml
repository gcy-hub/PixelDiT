# 64-sample AnyWord visual-text overfit test on JLU-wy.
# Training uses 32 samples; validation_prompts are the 32 held-out samples.
data:
  data_dir: [/home/wangye/projects/Anyword-3M/pixeldit_overfit64_jlu/train]
  image_size: 512
  caption_proportion:
    prompt: 1
  external_caption_suffixes: []
  external_clipscore_suffixes: []
  clip_thr_temperature: 0.1
  clip_thr: 0.0
  load_text_feat: false
  transform: default_train
  type: PixelDataset
  sort_dataset: false

model:
  model: PixDiTTrainer
  image_size: 512
  mixed_precision: bf16
  fp32_attention: true
  load_from: /home/wangye/projects/PixelDiT-1300M-1024px/pixeldit_t2i_v1.pth
  resume_from:
  aspect_ratio_type: ASPECT_RATIO_512
  multi_scale: false
  class_dropout_prob: 0.0
  extra:
    patch_size: 16
    num_groups: 24
    hidden_size: 1536
    pixel_hidden_size: 16
    pixel_attn_hidden_size: 1152
    pixel_num_groups: 16
    patch_depth: 14
    pixel_depth: 2
    num_text_blocks: 4
    txt_embed_dim: 2304
    txt_max_length: 300
    use_text_rope: true
    text_rope_theta: 10000.0
    repa_encoder_index: 6

text_encoder:
  text_encoder_name: gemma-2-2b-it
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  chi_prompt:
    - 'Given a user prompt, generate an "Enhanced prompt" that provides detailed visual descriptions suitable for image generation. Evaluate the level of detail in the user prompt:'
    - '- If the prompt is simple, focus on adding specifics about colors, shapes, sizes, textures, and spatial relationships to create vivid and concrete scenes.'
    - '- If the prompt is already detailed, refine and enhance the existing details slightly without overcomplicating.'
    - 'Here are examples of how to transform or refine prompts:'
    - '- User Prompt: A cat sleeping -> Enhanced: A small, fluffy white cat curled up in a round shape, sleeping peacefully on a warm sunny windowsill, surrounded by pots of blooming red flowers.'
    - '- User Prompt: A busy city street -> Enhanced: A bustling city street scene at dusk, featuring glowing street lamps, a diverse crowd of people in colorful clothing, and a double-decker bus passing by towering glass skyscrapers.'
    - 'Please generate only the enhanced description for the prompt below and avoid including any additional commentary or evaluations:'
    - 'User Prompt: '

scheduler:
  predict_flow_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  learn_sigma: false
  flow_shift: 4.0
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver

train:
  num_workers: 2
  seed: 1
  train_batch_size: 2
  num_epochs: 600
  max_train_steps: 2000
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 0.1
  repa_loss_weight: 0.0
  optimizer:
    betas: [0.9, 0.999, 0.9999]
    eps: [1.0e-30, 1.0e-16]
    lr: 1.0e-4
    type: CAMEWrapper
    weight_decay: 0.0
  override_lr_on_resume: true
  auto_lr:
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 0
  local_save_vis: true
  visualize: true
  deterministic_validation: false
  validate_at_start: false
  validation_prompts:
    - 'ford oval decal, with the visible word "Ford" clearly rendered in the image.'
    - 'let it snow christmas ornament, with the visible word "Snow" clearly rendered in the image.'
    - 'highland spa logo, with the visible word "Spa" clearly rendered in the image.'
    - 'wild by kristen kennedy doormat size 2 x 3, with the visible word "Wild" clearly rendered in the image.'
    - 'team crawley - yellow flowers rectangle sticker, with the visible word "Team" clearly rendered in the image.'
    - 'baby girl balloons with confetti and gold foil, with the visible word "Girl" clearly rendered in the image.'
    - 'reggae xixs the penguins, with the visible word "TREN" clearly rendered in the image.'
    - 'a teddy bear holding a heart with the word love, with the visible word "LOVE" clearly rendered in the image.'
    - 'obama 2012 magnet, with the visible word "2012" clearly rendered in the image.'
    - 'class of 2013 navy blue graduation round sticker, with the visible word "2013" clearly rendered in the image.'
    - 'a black case with two playing cards and a black case, with the visible word "WSOP" clearly rendered in the image.'
    - 'maier & associates financial group, inc, with the visible word "Inc." clearly rendered in the image.'
    - 'i love trig - colorful eye heart, with the visible word "Trig" clearly rendered in the image.'
    - 'no 900 - no 900, with the visible word "900" clearly rendered in the image.'
    - 'summer heat - various artists, with the visible word "eat" clearly rendered in the image.'
    - 'pixel farm logo, with the visible word "FARM" clearly rendered in the image.'
    - 'london city design tpu hard case for samsung galaxy s4 i9300 - blue, with the visible word "LONDON" clearly rendered in the image.'
    - 'a person holding a pink and purple manicure with a flower design, with the visible word "SMETICS" clearly rendered in the image.'
    - 'chicago bulls framed 23 michael jordan fanatics authentic framed jersey, with the visible word "JORDAN" clearly rendered in the image.'
    - 'i love my welsh girlfriend coffee mug, with the visible word "WELSH" clearly rendered in the image.'
